# dsh-whale-pet-balance bundle patch: mounts the desktop-pet Node half into the
# web profile. The Node half listens to agent/session events and pushes signals
# to the Electron pet window over local HTTP; it also spawns the pet on boot.
# NOTE: `name` must match the package name (dsh-whale-pet-balance).
- insert:
    - id: dsh-desktop-pet
      name: 'dsh-whale-pet-balance'
